<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Historial - Hotel Konford</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; }
        .card-custom { border: none; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        @media print {
            body { background-color: white !important; }
            .btn { display: none !important; }
            .card-custom { box-shadow: none !important; border: 1px solid #e2e8f0 !important; border-radius: 8px !important; }
            .container { max-width: 100% !important; }
        }
    </style>
</head>
<body class="py-5">
    <div class="container" style="max-width: 800px;">
        <div class="d-flex align-items-center mb-4">
            <a href="/trabajador/dashboard" class="btn btn-white bg-white rounded-circle shadow-sm me-3" style="width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; color: #6366f1;">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h2 class="fw-bold mb-0 flex-grow-1">Mi Historial de Asistencia</h2>
            <button class="btn btn-outline-primary rounded-pill px-4 shadow-sm" onclick="window.print()">
                <i class="fas fa-print me-2"></i> Descargar PDF
            </button>
        </div>

        <div class="card card-custom p-4 bg-white">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Fecha</th>
                            <th>Entrada</th>
                            <th>Salida</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="a : ${asistencias}">
                            <td th:text="${a.fecha}" class="fw-medium"></td>
                            <!-- Formato AM/PM con Segundos -->
                            <td th:text="${a.horaIngreso != null ? #temporals.format(a.horaIngreso, 'hh:mm:ss a') : '---'}"></td>
                            <td th:text="${a.horaSalida != null ? #temporals.format(a.horaSalida, 'hh:mm:ss a') : '---'}"></td>
                            <td>
                                <span th:class="${a.estado == 'PUNTUAL' ? 'badge bg-success-subtle text-success' : 'badge bg-warning-subtle text-warning'}" 
                                      th:text="${a.estado}" class="px-3 py-2 rounded-pill"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div th:if="${#lists.isEmpty(asistencias)}" class="text-center py-5 opacity-50">
                <i class="fas fa-calendar-xmark fa-3x mb-3"></i>
                <p>Aún no tienes registros de asistencia.</p>
            </div>
        </div>
    </div>
</body>
</html>

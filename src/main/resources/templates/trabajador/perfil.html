<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Hotel Konford</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; }
        .back-btn { position: absolute; top: 20px; left: 20px; color: white; text-decoration: none; z-index: 10; }
        .profile-header { 
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); 
            height: 200px; border-radius: 0 0 40px 40px; position: relative;
        }
        .profile-card { margin-top: -80px; }
        .avatar-container {
            width: 120px; height: 120px; background: white; border-radius: 35px;
            margin: 0 auto 15px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 4px solid white;
        }
        .avatar-container i { font-size: 3.5rem; color: #4f46e5; }
        .info-group { background: #f1f5f9; padding: 15px; border-radius: 15px; margin-bottom: 12px; }
        .info-label { font-size: 0.75rem; color: #64748b; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; display: block; }
        .info-value { font-weight: 600; color: #1e293b; display: block; }
        .card { border: none; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        .password-group { border-radius: 15px; overflow: hidden; }
        .toggle-password-profile {
            border: none; background: #e2e8f0; padding: 0 18px; color: #475569; transition: 0.3s;
        }
        .toggle-password-profile:hover { background: #cbd5e1; color: #1e293b; }
        .toggle-password-profile:focus { outline: none; box-shadow: none; }
    </style>
</head>
<body>
    <div class="profile-header">
        <a href="/trabajador/dashboard" class="back-btn fw-bold">
            <i class="fas fa-chevron-left me-1"></i> Volver
        </a>
    </div>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8 profile-card">
                <div class="card p-4 text-center mb-4">
                    <div class="avatar-container">
                        <i class="fas fa-user-tie"></i>
                    </div>
                    <h4 class="fw-bold mb-1" th:text="${empleado.nombreCompleto}">Juan Pérez</h4>
                    <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-2" th:text="${empleado.cargo}">Recepcionista</span>
                    
                    <div class="row mt-4 text-start">
                        <div class="col-6">
                            <div class="info-group">
                                <span class="info-label">DNI</span>
                                <span class="info-value" th:text="${empleado.dni}">12345678</span>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="info-group">
                                <span class="info-label">Área</span>
                                <span class="info-value" th:text="${empleado.area}">Recepción</span>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="info-group">
                                <span class="info-label">Horario Actual</span>
                                <span class="info-value"
                                      th:text="${empleado.horario != null} ? ${empleado.horario.nombre + ' (' + #temporals.format(empleado.horario.horaEntrada, 'HH:mm') + ' - ' + #temporals.format(empleado.horario.horaSalida, 'HH:mm') + ')'} : 'Sin horario asignado'">
                                    Mañana (8:00 - 16:00)
                                </span>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="info-group">
                                <span class="info-label">Correo Electrónico</span>
                                <span class="info-value" th:text="${empleado.email}">juan.perez@hotelkonford.com</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Cambio de Clave -->
                <div class="card p-4">
                    <h6 class="fw-bold mb-3"><i class="fas fa-lock me-2 text-primary"></i> Cambiar mi clave</h6>

                    <!-- ✅ SOLO ESTO SE AGREGÓ -->
                    <div th:if="${param.success}" class="alert mb-3"
                         style="background: #d1fae5; color: #065f46; border-radius: 15px; border: none; padding: 12px 18px;">
                        <i class="fas fa-check-circle me-2"></i> ¡Contraseña actualizada correctamente!
                    </div>

                    <form action="/trabajador/perfil/update" method="post">
                        <div class="mb-3">
                            <div class="input-group password-group">
                                <input type="password" name="newPassword" id="newPassword"
                                       class="form-control form-control-lg bg-light border-0"
                                       placeholder="Nueva contraseña" required minlength="4"
                                       style="border-radius: 15px 0 0 15px; font-size: 1rem;">
                                <button type="button" class="toggle-password-profile" id="toggleNewPassword">
                                    <i class="fas fa-eye" id="toggleNewPasswordIcon"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm" style="border-radius: 15px;">
                            Guardar Cambios
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const toggleNewPassword = document.getElementById('toggleNewPassword');
        const newPasswordInput = document.getElementById('newPassword');
        const toggleNewPasswordIcon = document.getElementById('toggleNewPasswordIcon');

        toggleNewPassword.addEventListener('click', function () {
            const isPassword = newPasswordInput.getAttribute('type') === 'password';
            newPasswordInput.setAttribute('type', isPassword ? 'text' : 'password');
            if (isPassword) {
                toggleNewPasswordIcon.classList.remove('fa-eye');
                toggleNewPasswordIcon.classList.add('fa-eye-slash');
            } else {
                toggleNewPasswordIcon.classList.remove('fa-eye-slash');
                toggleNewPasswordIcon.classList.add('fa-eye');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permisos - Hotel Konford</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f1f5f9; font-family: 'Inter', sans-serif; }
        .header-nav { background: white; padding: 15px; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; }
        .card { border: none; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .status-badge { padding: 6px 12px; border-radius: 10px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
        .request-item { background: white; border-radius: 20px; padding: 15px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="header-nav">
        <div class="container d-flex align-items-center">
            <a href="/trabajador/dashboard" class="text-dark me-3"><i class="fas fa-arrow-left fa-lg"></i></a>
            <h6 class="fw-bold mb-0">Solicitudes y Permisos</h6>
        </div>
    </div>

    <div class="container py-4">
        <!-- Formulario de Solicitud con carga de archivos -->
        <div class="card p-4 mb-4">
            <h6 class="fw-bold mb-3"><i class="fas fa-file-medical text-primary me-2"></i>Nueva Solicitud de Permiso</h6>
            
            <form th:action="@{/trabajador/permisos/solicitar}" method="post" enctype="multipart/form-data">
                
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">Tipo de Permiso</label>
                    <select name="tipoPermiso" class="form-select bg-light border-0 py-2" style="border-radius: 12px;">
                        <option value="SALUD">Salud / Licencia Médica</option>
                        <option value="MATERNIDAD">Maternidad / Paternidad</option>
                        <option value="PERSONAL" selected>Permiso Personal / Asuntos Propios</option>
                        <option value="OTRO">Otro Motivo</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">Motivo / Descripción</label>
                    <textarea name="motivo" class="form-control bg-light border-0" rows="3" 
                              placeholder="Describe el motivo de tu permiso..." required style="border-radius: 15px;"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">
                        <i class="fas fa-paperclip me-1 text-primary"></i>Adjuntar Comprobante o Sustento (Opcional - PDF / Imagen)
                    </label>
                    <input type="file" name="archivo" class="form-control bg-light border-0" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" style="border-radius: 12px;">
                    <small class="text-muted d-block mt-1" style="font-size: 0.75rem;">Sube un descanso médico, certificado u oficio que respalde tu solicitud.</small>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2" style="border-radius: 12px;">
                    <i class="fas fa-paper-plane me-1"></i> Enviar a Revisión
                </button>
            </form>
        </div>

        <!-- Lista de Solicitudes -->
        <h6 class="fw-bold mb-3 px-2">Mis Trámites</h6>
        <div th:each="p : ${permisos}" class="request-item shadow-sm">
            <div class="d-flex justify-content-between align-items-start mb-2">
                <div>
                    <span class="badge bg-primary-subtle text-primary mb-1" th:text="${p.tipoPermiso}">TIPO</span>
                    <span class="d-block fw-bold text-dark" th:text="${p.motivo}">Motivo</span>
                    <small class="text-muted" th:text="${#temporals.format(p.fechaSolicitud, 'dd MMM, yyyy - HH:mm')}">Fecha</small>
                </div>
                <span th:class="${p.estado == 'PENDIENTE' ? 'status-badge bg-warning-subtle text-warning' : (p.estado == 'APROBADO' ? 'status-badge bg-success-subtle text-success' : 'status-badge bg-danger-subtle text-danger')}" 
                      th:text="${p.estado}">PENDIENTE</span>
            </div>

            <!-- Botón de archivo adjunto si existe -->
            <div th:if="${p.comprobanteRuta}" class="mt-2">
                <a th:href="@{/uploads/permisos/{filename}(filename=${p.comprobanteRuta})}" target="_blank" class="btn btn-sm btn-outline-secondary rounded-pill py-1 px-3" style="font-size: 0.8rem;">
                    <i class="fas fa-paperclip me-1"></i> Ver Documento Adjunto
                </a>
            </div>
            
            <div th:if="${p.comentarioJefa}" class="mt-2 p-3 bg-light rounded-4 small border-start border-4 border-primary">
                <strong class="d-block mb-1 text-primary"><i class="fas fa-comment-dots me-1"></i> Respuesta de Jefatura:</strong>
                <span th:text="${p.comentarioJefa}"></span>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(permisos)}" class="text-center py-5 opacity-50">
            <i class="fas fa-folder-open fa-3x mb-3"></i>
            <p>No tienes solicitudes registradas.</p>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Hotel Konford</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1566073771259-6a8506099945?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.6);
            transform: scale(1.1);
            z-index: -1;
        }

        .login-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            color: white;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hotel-logo {
            width: 70px;
            height: 70px;
            background: white;
            color: #4e73df;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.9);
        }
        
        .form-control {
            border-radius: 12px;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            transition: all 0.3s;
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: white;
            color: white;
            box-shadow: none;
        }

        .password-group {
            border-radius: 12px;
            overflow: hidden;
        }

        .toggle-password {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-left: none;
            color: white;
            padding: 0 16px;
            transition: all 0.3s;
        }

        .toggle-password:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .btn-primary {
            border-radius: 12px;
            padding: 12px;
            background: #4e73df;
            border: none;
            font-weight: 800;
            font-size: 0.9rem;
            margin-top: 10px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            background: #3754bc;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .forgot-link {
            color: rgba(255,255,255,0.85);
            font-size: 0.8rem;
            text-decoration: none;
            transition: color 0.3s;
        }
        .forgot-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="hotel-logo">
                <i class="fas fa-concierge-bell"></i>
            </div>
            <h3 class="fw-bold mb-1">Hotel Konford</h3>
            <p class="small mb-4 text-white-50">Acceso Personal de Recepción y Administración</p>
            
            <!-- Alertas del Login y Recuperación -->
            <div th:if="${param.error}" class="alert alert-danger rounded-3 text-center py-2 mb-3" style="background: rgba(220,53,69,0.25); border: 1px solid rgba(220,53,69,0.4); color: white;">
                <i class="fas fa-exclamation-circle me-2"></i> Usuario o Contraseña incorrectos
            </div>
            <div th:if="${successReset}" class="alert alert-success rounded-3 text-center py-2 mb-3" style="background: rgba(25,135,84,0.3); border: 1px solid rgba(25,135,84,0.5); color: white;" th:text="${successReset}"></div>
            <div th:if="${errorReset}" class="alert alert-danger rounded-3 text-center py-2 mb-3" style="background: rgba(220,53,69,0.25); border: 1px solid rgba(220,53,69,0.4); color: white;" th:text="${errorReset}"></div>

            <!-- MANTIENE name="dni" para Spring Security -->
            <form action="/login" method="post" class="text-start">
                <div class="mb-3">
                    <label class="form-label">DOCUMENTO DEL EMPLEADO</label>
                    <input type="text" name="dni" class="form-control" placeholder="Ingresa tu usuario (DNI/C.E.)" required>
                </div>

                <div class="mb-2">
                    <label class="form-label">CONTRASEÑA</label>
                    <div class="input-group password-group">
                        <input 
                            type="password" 
                            name="password" 
                            id="password"
                            class="form-control" 
                            placeholder="••••••••" 
                            required
                        >
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="text-end mb-3">
                    <a href="#" class="forgot-link" data-bs-toggle="modal" data-bs-target="#modalRecuperar">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
            </form>

            <div class="mt-4 pt-3 border-top border-white-10">
                <p class="mb-0 x-small opacity-50">Sistema de Control v2.1.0</p>
            </div>
        </div>
    </div>

    <!-- Modal Recuperar Contraseña -->
    <div class="modal fade" id="modalRecuperar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form th:action="@{/recuperar-password}" method="post" class="modal-content border-0 shadow-lg text-dark" style="border-radius: 25px;">
                <div class="modal-header border-0 px-4 pt-4">
                    <h5 class="modal-title fw-bold text-dark"><i class="fas fa-key text-primary me-2"></i>Recuperar Contraseña</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 text-start">
                    <p class="small text-muted mb-3">Ingrese su número de documento registrado (DNI, C.E. o Pasaporte) para asignar una nueva contraseña de acceso.</p>
                    
                    <div class="mb-3">
                        <label class="form-label text-dark fw-bold mb-1">DOCUMENTO DEL EMPLEADO</label>
                        <input type="text" name="dni" class="form-control text-dark bg-light border-0" placeholder="Ej: 74581236" required style="border-radius: 12px;">
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-dark fw-bold mb-1">NUEVA CONTRASEÑA</label>
                        <input type="password" name="newPassword" class="form-control text-dark bg-light border-0" placeholder="Mínimo 6 caracteres" required style="border-radius: 12px;">
                    </div>
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" style="border-radius: 12px;">
                        Restablecer Contraseña
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');

        togglePassword.addEventListener('click', function () {
            const isPassword = passwordInput.getAttribute('type') === 'password';

            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');

            if (isPassword) {
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        });
    </script>
</body>
</html>
